[env:shadowgrid_remote]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Heltec V4 uses same board def as V3 with additional features
; SX1262: NSS=8, RST=12, DIO1=14, BUSY=13, SCK=9, MOSI=10, MISO=11
; OLED: SDA=17, SCL=18, RST=21
; GPS: RX=39, TX=38

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
    -DCONFIG_NIMBLE_MAX_CONNECTIONS=4
    -DSG_REMOTE
    -DHELTEC_V4=1

lib_deps =
    h2zero/NimBLE-Arduino@^2.0.0
    jgromes/RadioLib@^7.0.0
    bblanchon/ArduinoJson@^7.0.0
    ottowinter/ESPAsyncWebServer-esphome@^3.0.0
